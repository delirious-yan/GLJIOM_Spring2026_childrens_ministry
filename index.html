<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children's Ministry Dashboard - Spring 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        @media print {
            .no-print {
                display: none;
            }

            .print-break {
                page-break-after: always;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans leading-relaxed">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Spring 2026 Curriculum</h1>
                <p class="text-slate-600 font-medium italic">Theme: Romans 4:7-8 (Forgiveness)</p>
            </div>
            <div class="flex flex-wrap gap-2 no-print">
                <button onclick="switchView('table')" id="btn-table"
                    class="view-btn px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold transition hover:bg-blue-700">Table
                    View</button>
                <button onclick="switchView('cards')" id="btn-cards"
                    class="view-btn px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-semibold transition hover:bg-slate-300">Cheat
                    Sheets</button>
                <button onclick="switchView('full')" id="btn-full"
                    class="view-btn px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-semibold transition hover:bg-slate-300">Full
                    Plan</button>
                <button onclick="window.print()"
                    class="px-4 py-2 rounded-lg bg-slate-800 text-white font-semibold transition hover:bg-slate-900">Print</button>
            </div>
        </header>

        <!-- Table View -->
        <div id="view-table" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 border-bottom border-slate-200">
                        <tr>
                            <th class="p-4 font-bold text-sm text-slate-600 uppercase tracking-wider">Date/Topic</th>
                            <th class="p-4 font-bold text-sm text-slate-600 uppercase tracking-wider w-1/4">Key Points
                            </th>
                            <th class="p-4 font-bold text-sm text-slate-600 uppercase tracking-wider w-1/4">Teaching
                                Prompt</th>
                            <th class="p-4 font-bold text-sm text-slate-600 uppercase tracking-wider">Activity &
                                Supplies</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Card View (Hidden by Default) -->
        <div id="view-cards" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected via JS -->
        </div>

        <!-- Full View (Detailed) -->
        <div id="view-full" class="hidden space-y-8">
            <!-- Full details injected via JS -->
        </div>

        <!-- Master Shopping List -->
        <section class="mt-12 bg-white p-6 rounded-xl border border-slate-200 shadow-sm print-break">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>🛒</span> Master Shopping List
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="shopping-list">
                <!-- List categories injected via JS -->
            </div>
        </section>
    </div>

    <script>
        const lessons = [
            {
                date: "March 15",
                topic: "Disobedience (Adam & Eve)",
                bible: "Genesis 3 | Rom 3:23",
                verse: "For all have sinned and fall short of the glory of God.",
                points: "Recap Creation; focus on the choice made in the garden and the consequence.",
                discussion: ["Why did Adam and Eve hide from God?", "Do we ever try to hide when we do something wrong?", "What happened when they didn't follow God's boundaries?"],
                prompt: "Use a 'No Entry' sign. Discuss why rules are for protection, not just control.",
                activity: "The Choice Tree",
                detailedActivity: "Have kids draw a large tree. On one side, draw 'Good Fruits' labeled with acts of obedience (sharing, truth). On the other, 'Bad Fruits' labeled with disobedience (lying, hiding). Talk about how our choices grow into habits.",
                supplies: ["Large paper", "Markers", "Crayons", "Fruit stickers"],
                color: "bg-green-500"
            },
            {
                date: "March 21",
                topic: "Forgiveness (The Rescue)",
                bible: "John 3:16",
                verse: "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.",
                points: "God's rescue mission through Jesus. Focusing on the 'Why' behind His birth.",
                discussion: ["What does it mean to be 'rescued'?", "Why did Jesus come as a baby and not a king with an army?", "How does Jesus fix our relationship with God?"],
                prompt: "Explain Jesus as the 'Bridge' crossing the gap of sin created in Week 1.",
                activity: "Popsicle Bridge",
                detailedActivity: "Using blue construction paper as 'sin/the gap', have children build a bridge using popsicle sticks. Label one side 'Us' and the other 'God'. Write 'JESUS' across the popsicle sticks connecting them.",
                supplies: ["Popsicle sticks", "Glue", "Blue construction paper", "Thick markers"],
                color: "bg-red-500"
            },
            {
                date: "March 28",
                topic: "The Savior (The Manger)",
                bible: "John 1:1-4",
                verse: "In the beginning was the Word, and the Word was with God, and the Word was God... In him was life, and that life was the light of all mankind.",
                points: "Shepherds/Wise Men recognizing the Light. Seeking Jesus today.",
                discussion: ["Why did the Wise Men travel so far?", "How would you feel if a bright angel appeared while you were sleeping?", "How can we seek Jesus in our lives today?"],
                prompt: "Shepherd Perspective. Imagine the shock and joy of the angel appearance.",
                activity: "Star Search",
                detailedActivity: "Pre-write names of Jesus (Savior, King, Light) on yellow stars. Hide them around the room. Kids find them and we read each name out loud, discussing what it means.",
                supplies: ["Yellow cardstock", "Scissors", "Markers", "Painter's tape"],
                color: "bg-yellow-400"
            },
            {
                date: "April 04",
                topic: "Temptation (The Wilderness)",
                bible: "Matthew 4:4",
                verse: "Jesus answered, 'It is written: Man shall not live on bread alone, but on every word that comes from the mouth of God.'",
                points: "Jesus using the Word to stay strong. Identifying our daily temptations.",
                discussion: ["What does 'It is written' mean?", "Why is the Bible like food for our spirit?", "What are some things that tempt us to be unkind?"],
                prompt: "Backpack & Rocks. Every rock is a 'weight' or temptation that Jesus helps us carry.",
                activity: "Sword of the Spirit",
                detailedActivity: "Cut out sword shapes from cardboard. Wrap in foil. Have kids write 'God's Word' or their favorite verse on the blade to show that knowing the Bible is our defense.",
                supplies: ["Sturdy cardboard", "Foil", "Scissors", "Permanent markers"],
                color: "bg-orange-500"
            },
            {
                date: "April 11",
                topic: "The Law (10 Commandments)",
                bible: "Matt 22:37-39",
                verse: "Love the Lord your God with all your heart... and love your neighbor as yourself.",
                points: "Learning how to live. Rules keep relationships healthy.",
                discussion: ["Why do we have traffic lights?", "How does loving God first help us love other people?", "Which commandment do you find most helpful?"],
                prompt: "Traffic Light. Red, Yellow, Green show us how to move safely through life.",
                activity: "Two Tablets",
                detailedActivity: "Fold grey paper in half and cut out the 'tablet' shape. On one side, write 'Love God'. On the other, 'Love People'. List simple ways to do both inside.",
                supplies: ["Grey paper", "Scissors", "Markers", "White chalk"],
                color: "bg-blue-500"
            },
            {
                date: "April 18",
                topic: "Miracles of Jesus",
                bible: "Mark 4-5",
                verse: "They were terrified and asked each other, 'Who is this? Even the wind and the waves obey him!' - Mark 4:41",
                points: "Focus on the miracles Jesus performed while He was on earth, showing His power and love.",
                discussion: ["What is a miracle?", "Why did Jesus perform miracles?", "If you saw Jesus calm a storm or heal someone, how would you feel?"],
                prompt: "Visual Storybook. Show pictures of Jesus healing the blind or calming the storm to illustrate His power over nature and sickness.",
                activity: "Miracle Scene Coloring",
                detailedActivity: "Provide illustrations of famous miracles (Calming the Storm or Feeding 5,000). As kids color, explain that Jesus did these things to show that He is the Son of God and that He cares for us.",
                supplies: ["Miracle coloring sheets", "Crayons", "Markers", "Pencils"],
                color: "bg-purple-500"
            },
            {
                date: "April 25",
                topic: "Death & Resurrection",
                bible: "Matthew 27-28",
                verse: "He is not here; he has risen, just as he said. Come and see the place where he lay. - Matthew 28:6",
                points: "Jesus died on the cross for our sins and on the 3rd day He rose again. This is the ultimate proof of God's love and the victory over sin.",
                discussion: ["Why did Jesus have to die on the cross?", "What happened on the third day?", "How do we know Jesus is still alive today?"],
                prompt: "The Empty Tomb & Cross. Use a visual of a cross and an empty tomb to show the sacrifice and the victory.",
                activity: "Resurrection Scene",
                detailedActivity: "Construct a scene showing the hill with three crosses and the empty tomb. Discuss how the cross represents the price paid for our sins, while the empty tomb represents our hope for eternal life.",
                supplies: ["Small pots/cups", "Soil/moss", "Stones", "Twigs", "Cardstock for crosses"],
                color: "bg-slate-400"
            },
            {
                date: "May 02",
                topic: "Salvation (Invitation)",
                bible: "Revelation 3:20",
                verse: "Here I am! I stand at the door and knock. If anyone hears my voice and opens the door, I will come in...",
                points: "Making it personal. How to accept the gift of forgiveness.",
                discussion: ["What does it feel like when someone knocks on your door?", "How do we 'open the door' to Jesus?", "What is a 'personal savior'?"],
                prompt: "The Gift Box. A gift must be opened to be enjoyed. Forgiveness is a gift we must accept.",
                activity: "Key to My Heart",
                detailedActivity: "Cut out key shapes from yellow cardstock. Punch a hole and tie a red ribbon. Write 'Jesus' on the key and 'My Heart' on a red cardstock heart to symbolize giving Him access to our lives.",
                supplies: ["Red/Yellow cardstock", "Hole punch", "Ribbon", "Markers"],
                color: "bg-pink-500"
            }
        ];

        const shoppingCategories = {
            "Paper & Tools": ["Cardstock (Y, R, G, B)", "Drawing Paper", "Storyboard Templates", "Scissors", "Hole Punch", "Glue/Tape"],
            "Art Supplies": ["Pencils/Colors", "Markers (Washable/Permanent)", "Crayons", "Popsicle Sticks", "Foil", "Stickers", "Miracle Coloring Sheets"],
            "Props & Nature": ["Backpack + Rocks", "Stuffed Sheep", "Gift Box", "Small Pots", "Soil/Moss", "Stones", "Twigs"]
        };

        function switchView(view) {
            const table = document.getElementById('view-table');
            const cards = document.getElementById('view-cards');
            const full = document.getElementById('view-full');

            // Hide all
            [table, cards, full].forEach(v => v.classList.add('hidden'));

            // Show selected
            document.getElementById(`view-${view}`).classList.remove('hidden');

            // Update buttons
            document.querySelectorAll('.view-btn').forEach(btn => {
                if (btn.id === `btn-${view}`) {
                    btn.className = "view-btn px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold transition";
                } else {
                    btn.className = "view-btn px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-semibold transition";
                }
            });
        }

        function renderData() {
            const tableBody = document.getElementById('table-body');
            const cardGrid = document.getElementById('view-cards');
            const fullView = document.getElementById('view-full');
            const shoppingGrid = document.getElementById('shopping-list');

            lessons.forEach(lesson => {
                // Table Row
                const row = document.createElement('tr');
                row.className = "border-b border-slate-100 hover:bg-slate-50 transition";
                row.innerHTML = `
                    <td class="p-4 border-l-4 ${lesson.color.replace('bg-', 'border-')}">
                        <span class="block text-xs font-bold text-slate-500 uppercase">${lesson.date}</span>
                        <span class="font-bold text-slate-800">${lesson.topic}</span>
                        <div class="text-xs italic text-blue-600 mt-1">${lesson.bible}</div>
                    </td>
                    <td class="p-4 text-sm text-slate-600">${lesson.points}</td>
                    <td class="p-4 text-sm font-medium text-slate-700 bg-slate-50/50 italic">"${lesson.prompt}"</td>
                    <td class="p-4 text-sm">
                        <strong class="text-slate-800">${lesson.activity}</strong>
                        <div class="text-xs text-slate-500 mt-1">${lesson.supplies.join(", ")}</div>
                    </td>
                `;
                tableBody.appendChild(row);

                // Card (Cheat Sheet)
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 p-5 card-shadow";
                card.innerHTML = `
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-3 h-3 rounded-full ${lesson.color}"></div>
                        <h3 class="font-bold text-lg">${lesson.date} | ${lesson.topic.split('(')[0]}</h3>
                    </div>
                    <div class="space-y-3 text-sm">
                        <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 font-medium">
                            <span class="text-blue-800">Verse: </span> ${lesson.verse.substring(0, 60)}...
                        </div>
                        <p><span class="font-bold">Prompt:</span> ${lesson.prompt}</p>
                        <p><span class="font-bold">Activity:</span> ${lesson.activity}</p>
                    </div>
                `;
                cardGrid.appendChild(card);

                // Full Plan View
                const fullSection = document.createElement('div');
                fullSection.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm";
                fullSection.innerHTML = `
                    <div class="${lesson.color} p-6 text-white">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-2xl font-bold">${lesson.topic}</h2>
                                <p class="text-white/80 font-medium">${lesson.date} | ${lesson.bible}</p>
                            </div>
                        </div>
                    </div>
                    <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <section>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Memory Verse</h4>
                                <p class="text-xl font-serif text-slate-800 italic leading-relaxed">"${lesson.verse}"</p>
                            </section>
                            <section>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Key Lesson Points</h4>
                                <p class="text-slate-700 leading-relaxed">${lesson.points}</p>
                            </section>
                            <section>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Discussion Questions</h4>
                                <ul class="list-disc ml-5 space-y-2 text-slate-700">
                                    ${lesson.discussion.map(q => `<li>${q}</li>`).join('')}
                                </ul>
                            </section>
                        </div>
                        <div class="space-y-6 bg-slate-50 p-6 rounded-xl border border-slate-100">
                            <section>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Teaching Visual/Prompt</h4>
                                <div class="bg-white p-4 rounded border border-slate-200 shadow-sm text-slate-800">
                                    ${lesson.prompt}
                                </div>
                            </section>
                            <section>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Detailed Activity: ${lesson.activity}</h4>
                                <p class="text-slate-700 leading-relaxed mb-4">${lesson.detailedActivity}</p>
                                <div class="bg-white/50 p-3 rounded border border-dashed border-slate-300">
                                    <h5 class="text-xs font-bold text-slate-500 uppercase mb-2">Supplies Needed</h5>
                                    <div class="flex flex-wrap gap-2">
                                        ${lesson.supplies.map(s => `<span class="px-2 py-1 bg-white rounded text-xs border border-slate-200 text-slate-600">${s}</span>`).join('')}
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                `;
                fullView.appendChild(fullSection);
            });

            // Shopping List
            for (const [category, items] of Object.entries(shoppingCategories)) {
                const col = document.createElement('div');
                col.innerHTML = `<h3 class="font-bold text-slate-800 border-b pb-2 mb-3">${category}</h3>`;
                items.forEach(item => {
                    col.innerHTML += `
                        <label class="flex items-center gap-2 mb-2 cursor-pointer text-sm text-slate-600 hover:text-slate-900">
                            <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            <span>${item}</span>
                        </label>
                    `;
                });
                shoppingGrid.appendChild(col);
            }
        }

        window.onload = renderData;
    </script>
</body>

</html>
